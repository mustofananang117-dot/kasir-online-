<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Kasir Toko</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 70px; }
    
    header { background: var(--primary); color: white; padding: 1rem; text-align: center; font-weight: bold; font-size: 1.2rem; }
    
    nav { position: fixed; bottom: 0; width: 100%; background: var(--surface); display: flex; border-top: 1px solid var(--border); }
    nav button { flex: 1; padding: 12px; border: none; background: none; font-size: 0.9rem; font-weight: 600; color: #64748b; cursor: pointer; }
    nav button.active { color: var(--primary); border-top: 3px solid var(--primary); }

    .tab-content { display: none; padding: 1rem; }
    .tab-content.active { display: block; }

    .card { background: var(--surface); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; border: 1px solid var(--border); }
    h2 { font-size: 1.1rem; margin-bottom: 0.8rem; }
    
    input, button, select { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }
    button.btn-primary { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
    button.btn-danger { background: #ef4444; color: white; border: none; font-weight: bold; }
    
    .grid-produk { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 1rem; }
    .item-produk { background: var(--surface); border: 1px solid var(--border); padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; }
    .item-produk h4 { font-size: 0.9rem; }
    .item-produk p { font-size: 0.85rem; color: var(--primary); font-weight: bold; }

    table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; font-size: 0.9rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); }
    th { background: #f1f5f9; }

    .total-box { font-size: 1.2rem; font-weight: bold; margin-top: 10px; text-align: right; }
  </style>
</head>
<body>

  <header>Kasir Toko (POS)</header>

  <!-- TAB KASIR -->
  <div id="tab-kasir" class="tab-content active">
    <div class="card">
      <h2>Pilih Produk</h2>
      <div class="grid-produk" id="daftar-produk-kasir"></div>
    </div>

    <div class="card">
      <h2>Keranjang Penjualan</h2>
      <table>
        <thead>
          <tr>
            <th>Barang</th>
            <th>Qty</th>
            <th>Total</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tabel-keranjang"></tbody>
      </table>
      
      <div class="total-box">Total: Rp <span id="text-total">0</span></div>
      
      <div style="margin-top: 15px;">
        <label>Bayar (Rp):</label>
        <input type="number" id="input-bayar" placeholder="0" oninput="hitungKembalian()">
        <div style="text-align: right; margin-bottom: 10px; font-size: 1rem;">
          Kembalian: <b>Rp <span id="text-kembalian">0</span></b>
        </div>
        <button class="btn-primary" onclick="prosesTransaksi()">Selesaikan Transaksi</button>
      </div>
    </div>
  </div>

  <!-- TAB MANAJEMEN PRODUK -->
  <div id="tab-produk" class="tab-content">
    <div class="card">
      <h2>Tambah Produk Baru</h2>
      <input type="text" id="nama-produk" placeholder="Nama Produk (misal: Es Teh)">
      <input type="number" id="harga-produk" placeholder="Harga (Rp)">
      <input type="number" id="stok-produk" placeholder="Jumlah Stok">
      <button class="btn-primary" onclick="tambahProduk()">Simpan Produk</button>
    </div>

    <div class="card">
      <h2>Daftar Produk</h2>
      <table>
        <thead>
          <tr>
            <th>Nama</th>
            <th>Harga</th>
            <th>Stok</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tabel-produk-master"></tbody>
      </table>
    </div>
  </div>

  <!-- NAVIGASI BAWAH -->
  <nav>
    <button id="btn-tab-kasir" class="active" onclick="switchTab('kasir')">🛒 Transaksi</button>
    <button id="btn-tab-produk" onclick="switchTab('produk')">📦 Produk</button>
  </nav>

  <script>
    // State Data
    let produkList = JSON.parse(localStorage.getItem('pos_produk')) || [
      { id: 1, nama: 'Kopi Hitam', harga: 5000, stok: 20 },
      { id: 2, nama: 'Roti Bakar', harga: 10000, stok: 15 }
    ];
    let keranjang = [];

    // Ganti Tab View
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`tab-${tabName}`).classList.add('active');
      document.getElementById(`btn-tab-${tabName}`).classList.add('active');
      
      renderAll();
    }

    // Save Data ke HP (LocalStorage)
    function simpanData() {
      localStorage.setItem('pos_produk', JSON.stringify(produkList));
    }

    // Render Tampilan
    function renderAll() {
      renderProdukKasir();
      renderTabelKeranjang();
      renderTabelMasterProduk();
    }

    // 1. TAMPILAN KASIR
    function renderProdukKasir() {
      const container = document.getElementById('daftar-produk-kasir');
      container.innerHTML = '';
      produkList.forEach(p => {
        container.innerHTML += `
          <div class="item-produk" onclick="tambahKeKeranjang(${p.id})">
            <h4>${p.nama}</h4>
            <p>Rp ${p.harga.toLocaleString()}</p>
            <small>Stok: ${p.stok}</small>
          </div>
        `;
      });
    }

    function tambahKeKeranjang(id) {
      const produk = produkList.find(p => p.id === id);
      if (produk.stok <= 0) {
        alert('Stok barang habis!');
        return;
      }
      
      const itemInCart = keranjang.find(k => k.id === id);
      if (itemInCart) {
        if (itemInCart.qty < produk.stok) {
          itemInCart.qty++;
        } else {
          alert('Stok tidak mencukupi!');
        }
      } else {
        keranjang.push({ ...produk, qty: 1 });
      }
      renderTabelKeranjang();
    }

    function renderTabelKeranjang() {
      const tbody = document.getElementById('tabel-keranjang');
      tbody.innerHTML = '';
      let total = 0;

      keranjang.forEach((item, index) => {
        const subtotal = item.harga * item.qty;
        total += subtotal;
        tbody.innerHTML += `
          <tr>
            <td>${item.nama}</td>
            <td>${item.qty}</td>
            <td>Rp ${subtotal.toLocaleString()}</td>
            <td><button class="btn-danger" style="padding: 2px 6px; font-size:0.8rem" onclick="hapusDariKeranjang(${index})">X</button></td>
          </tr>
        `;
      });

      document.getElementById('text-total').innerText = total.toLocaleString();
      hitungKembalian();
    }

    function hapusDariKeranjang(index) {
      keranjang.splice(index, 1);
      renderTabelKeranjang();
    }

    function hitungKembalian() {
      const total = keranjang.reduce((sum, item) => sum + (item.harga * item.qty), 0);
      const bayar = parseFloat(document.getElementById('input-bayar').value) || 0;
      const kembalian = bayar - total;
      document.getElementById('text-kembalian').innerText = (kembalian >= 0 ? kembalian : 0).toLocaleString();
    }

    function prosesTransaksi() {
      const total = keranjang.reduce((sum, item) => sum + (item.harga * item.qty), 0);
      const bayar = parseFloat(document.getElementById('input-bayar').value) || 0;

      if (keranjang.length === 0) return alert('Keranjang masih kosong!');
      if (bayar < total) return alert('Uang pembayaran kurang!');

      // Potong Stok
      keranjang.forEach(item => {
        const produk = produkList.find(p => p.id === item.id);
        if (produk) produk.stok -= item.qty;
      });

      simpanData();
      alert('Transaksi Berhasil!');
      
      // Reset Transaksi
      keranjang = [];
      document.getElementById('input-bayar').value = '';
      renderAll();
    }

    // 2. TAMPILAN MASTER PRODUK
    function tambahProduk() {
      const nama = document.getElementById('nama-produk').value;
      const harga = parseFloat(document.getElementById('harga-produk').value);
      const stok = parseInt(document.getElementById('stok-produk').value);

      if (!nama || isNaN(harga) || isNaN(stok)) {
        alert('Mohon isi semua data produk dengan benar!');
        return;
      }

      produkList.push({ id: Date.now(), nama, harga, stok });
      simpanData();
      
      document.getElementById('nama-produk').value = '';
      document.getElementById('harga-produk').value = '';
      document.getElementById('stok-produk').value = '';
      
      alert('Produk berhasil ditambahkan!');
      renderAll();
    }

    function renderTabelMasterProduk() {
      const tbody = document.getElementById('tabel-produk-master');
      tbody.innerHTML = '';
      produkList.forEach(p => {
        tbody.innerHTML += `
          <tr>
            <td>${p.nama}</td>
            <td>Rp ${p.harga.toLocaleString()}</td>
            <td>${p.stok}</td>
            <td><button class="btn-danger" style="padding: 2px 6px; font-size:0.8rem" onclick="hapusProdukMaster(${p.id})">Hapus</button></td>
          </tr>
        `;
      });
    }

    function hapusProdukMaster(id) {
      if (confirm('Yakin ingin menghapus produk ini?')) {
        produkList = produkList.filter(p => p.id !== id);
        simpanData();
        renderAll();
      }
    }

    // Inisialisasi awal
    renderAll();
  </script>
</body>
</html>
